<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบวิชา ระบบสารสนเทศเพื่อการจัดการ (MIS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
        }
        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover {
            transform: translateY(-2px);
        }
        .option-selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1e3a8a;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main App Container -->
    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden fade-in">
        
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold">แบบทดสอบวิชา MIS</h1>
            <p class="text-blue-100 mt-2 text-sm md:text-base">ระบบสารสนเทศเพื่อการจัดการ (Management Information Systems)</p>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="p-8 text-center">
            <div class="mb-8">
                <svg class="w-20 h-20 mx-auto text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">ยินดีต้อนรับสู่แบบทดสอบ</h2>
                <p class="text-gray-600">แบบทดสอบชุดนี้มีจำนวน <span id="total-start"></span> ข้อ ระบบจะตรวจคำตอบและแสดงคำอธิบายทันทีหลังจากที่คุณตอบในแต่ละข้อ</p>
            </div>
            <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                เริ่มทำแบบทดสอบ
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden p-6 md:p-8">
            <!-- Progress Bar -->
            <div class="mb-6">
                <div class="flex justify-between text-sm text-gray-500 font-medium mb-2">
                    <span>ข้อที่ <span id="current-question-num">1</span> / <span id="total-questions">15</span></span>
                    <span>คะแนน: <span id="current-score" class="text-blue-600 font-bold">0</span></span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Question -->
            <h2 id="question-text" class="text-xl md:text-2xl font-semibold text-gray-800 mb-6 leading-relaxed">
                <!-- Question text will be injected here -->
            </h2>

            <!-- Options -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options will be injected here -->
            </div>

            <!-- Feedback Section (Hidden by default) -->
            <div id="feedback-container" class="hidden rounded-lg p-5 mb-6 fade-in border-l-4">
                <div class="flex items-start">
                    <div id="feedback-icon" class="flex-shrink-0 mt-0.5">
                        <!-- Icon injected here -->
                    </div>
                    <div class="ml-3 w-full">
                        <h3 id="feedback-title" class="text-lg font-bold"></h3>
                        <div class="mt-2 text-sm md:text-base text-gray-700">
                            <p class="font-semibold mb-1">เฉลยที่ถูกต้อง: <span id="correct-answer-text" class="font-normal text-gray-800"></span></p>
                            <div class="bg-white/50 rounded p-3 mt-2">
                                <span class="font-semibold block mb-1">คำอธิบาย (Rationale):</span>
                                <span id="rationale-text" class="text-gray-800"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-end">
                <button id="submit-btn" onclick="submitAnswer()" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-2.5 px-6 rounded-lg transition duration-300">
                    ตรวจคำตอบ
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-6 rounded-lg transition duration-300">
                    ข้อถัดไป
                </button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden p-8 text-center">
            <div class="mb-8">
                <div id="result-icon" class="w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl">
                    <!-- Emoji injected here -->
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">สรุปผลคะแนน</h2>
                <p class="text-gray-600 text-lg">คุณทำคะแนนได้</p>
                <div class="text-5xl font-extrabold text-blue-600 mt-4 mb-2">
                    <span id="final-score">0</span> / <span id="final-total">0</span>
                </div>
                <p id="result-message" class="text-gray-500 font-medium"></p>
            </div>
            <button onclick="resetQuiz()" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out">
                ทำแบบทดสอบอีกครั้ง
            </button>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // ---------------------------------------------------------
        // 1. Data Structure: Array of Question Objects (JSON format)
        // คุณสามารถเพิ่ม/ลด/แก้ไข ข้อสอบ 140 ข้อได้ใน Array นี้
        // ---------------------------------------------------------

        // ---------------------------------------------------------
        // 2. State Variables

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswerSubmitted = false;

        // DOM Elements
        const elStartScreen = document.getElementById('start-screen');
        const elQuizScreen = document.getElementById('quiz-screen');
        const elResultScreen = document.getElementById('result-screen');
        
        const elTotalStart = document.getElementById('total-start');
        const elQuestionNum = document.getElementById('current-question-num');
        const elTotalQuestions = document.getElementById('total-questions');
        const elCurrentScore = document.getElementById('current-score');
        const elProgressBar = document.getElementById('progress-bar');
        
        const elQuestionText = document.getElementById('question-text');
        const elOptionsContainer = document.getElementById('options-container');
        
        const elSubmitBtn = document.getElementById('submit-btn');
        const elNextBtn = document.getElementById('next-btn');
        
        const elFeedbackContainer = document.getElementById('feedback-container');
        const elFeedbackIcon = document.getElementById('feedback-icon');
        const elFeedbackTitle = document.getElementById('feedback-title');
        const elCorrectAnswerText = document.getElementById('correct-answer-text');
        const elRationaleText = document.getElementById('rationale-text');

        // Init
        elTotalStart.innerText = quizData.length;
        elTotalQuestions.innerText = quizData.length;

        // ---------------------------------------------------------
        // 3. Functions
        // ---------------------------------------------------------
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            elStartScreen.classList.add('hidden');
            elResultScreen.classList.add('hidden');
            elQuizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            // Reset states
            selectedOptionIndex = null;
            isAnswerSubmitted = false;
            elSubmitBtn.disabled = true;
            elSubmitBtn.classList.remove('hidden');
            elNextBtn.classList.add('hidden');
            elFeedbackContainer.classList.add('hidden');

            const currentQ = quizData[currentQuestionIndex];
            
            // Update UI
            elQuestionNum.innerText = currentQuestionIndex + 1;
            elCurrentScore.innerText = score;
            const progressPercentage = (currentQuestionIndex / quizData.length) * 100;
            elProgressBar.style.width = `${progressPercentage}%`;
            
            elQuestionText.innerText = currentQ.question;
            
            // Render Options
            elOptionsContainer.innerHTML = '';
            const prefixes = ['ก.', 'ข.', 'ค.', 'ง.'];
            
            currentQ.options.forEach((optionText, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = `option-btn border-2 border-gray-200 rounded-lg p-4 cursor-pointer text-gray-700 bg-white flex items-start gap-3 hover:bg-gray-50`;
                optionDiv.onclick = () => selectOption(index, optionDiv);
                
                optionDiv.innerHTML = `
                    <div class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 font-semibold text-gray-600">
                        ${prefixes[index]}
                    </div>
                    <div class="mt-1">${optionText}</div>
                `;
                
                elOptionsContainer.appendChild(optionDiv);
            });
        }

        function selectOption(index, optionElement) {
            if (isAnswerSubmitted) return; // Prevent changing answer after submit

            selectedOptionIndex = index;
            elSubmitBtn.disabled = false;

            // Remove selected styling from all
            const allOptions = elOptionsContainer.children;
            for(let i=0; i<allOptions.length; i++) {
                allOptions[i].classList.remove('option-selected', 'border-blue-500', 'bg-blue-50');
                allOptions[i].querySelector('.rounded-full').classList.remove('bg-blue-600', 'text-white');
                allOptions[i].querySelector('.rounded-full').classList.add('bg-gray-100', 'text-gray-600');
            }

            // Add selected styling to clicked
            optionElement.classList.add('option-selected', 'border-blue-500', 'bg-blue-50');
            optionElement.querySelector('.rounded-full').classList.remove('bg-gray-100', 'text-gray-600');
            optionElement.querySelector('.rounded-full').classList.add('bg-blue-600', 'text-white');
        }

        function submitAnswer() {
            if (selectedOptionIndex === null) return;
            isAnswerSubmitted = true;
            
            const currentQ = quizData[currentQuestionIndex];
            const isCorrect = selectedOptionIndex === currentQ.answerIndex;
            const prefixes = ['ก', 'ข', 'ค', 'ง'];

            // Disable all options
            const allOptions = elOptionsContainer.children;
            for(let i=0; i<allOptions.length; i++) {
                allOptions[i].classList.remove('cursor-pointer', 'hover:bg-gray-50');
                allOptions[i].classList.add('cursor-default', 'opacity-60');
                allOptions[i].onclick = null;
            }

            // Highlight Correct and Selected
            if (isCorrect) {
                score++;
                elCurrentScore.innerText = score;
                // Style selected (which is correct)
                allOptions[selectedOptionIndex].classList.remove('border-blue-500', 'bg-blue-50', 'opacity-60');
                allOptions[selectedOptionIndex].classList.add('border-green-500', 'bg-green-50', 'opacity-100');
                allOptions[selectedOptionIndex].querySelector('.rounded-full').classList.replace('bg-blue-600', 'bg-green-600');
                
                // Feedback UI
                setupFeedback(true, currentQ, prefixes);
            } else {
                // Style selected (incorrect)
                allOptions[selectedOptionIndex].classList.remove('border-blue-500', 'bg-blue-50', 'opacity-60');
                allOptions[selectedOptionIndex].classList.add('border-red-500', 'bg-red-50', 'opacity-100');
                allOptions[selectedOptionIndex].querySelector('.rounded-full').classList.replace('bg-blue-600', 'bg-red-600');
                
                // Style actual correct
                allOptions[currentQ.answerIndex].classList.remove('opacity-60');
                allOptions[currentQ.answerIndex].classList.add('border-green-500', 'bg-green-50', 'opacity-100');
                
                // Feedback UI
                setupFeedback(false, currentQ, prefixes);
            }

            elSubmitBtn.classList.add('hidden');
            elNextBtn.classList.remove('hidden');
            
            // Change button text if last question
            if (currentQuestionIndex === quizData.length - 1) {
                elNextBtn.innerText = "ดูสรุปผลคะแนน";
                elProgressBar.style.width = `100%`;
            }
        }

        function setupFeedback(isCorrect, currentQ, prefixes) {
            elFeedbackContainer.classList.remove('hidden', 'bg-green-100', 'border-green-500', 'bg-red-100', 'border-red-500');
            
            if (isCorrect) {
                elFeedbackContainer.classList.add('bg-green-50', 'border-green-500');
                elFeedbackTitle.innerText = "ถูกต้อง เยี่ยมมาก!";
                elFeedbackTitle.className = "text-lg font-bold text-green-700";
                elFeedbackIcon.innerHTML = `
                    <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>`;
            } else {
                elFeedbackContainer.classList.add('bg-red-50', 'border-red-500');
                elFeedbackTitle.innerText = "คำตอบยังไม่ถูกต้อง";
                elFeedbackTitle.className = "text-lg font-bold text-red-700";
                elFeedbackIcon.innerHTML = `
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>`;
            }

            elCorrectAnswerText.innerText = `${prefixes[currentQ.answerIndex]}. ${currentQ.options[currentQ.answerIndex]}`;
            elRationaleText.innerText = currentQ.rationale;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            elQuizScreen.classList.add('hidden');
            elResultScreen.classList.remove('hidden');
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-total').innerText = quizData.length;
            
            const percentage = (score / quizData.length) * 100;
            const elResultMessage = document.getElementById('result-message');
            const elResultIcon = document.getElementById('result-icon');
            
            if (percentage >= 80) {
                elResultIcon.innerText = "🏆";
                elResultIcon.className = "w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-5xl bg-yellow-100 shadow-inner";
                elResultMessage.innerText = "ยอดเยี่ยมมาก! คุณมีความเข้าใจในระบบสารสนเทศระดับสูง";
            } else if (percentage >= 60) {
                elResultIcon.innerText = "👍";
                elResultIcon.className = "w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-5xl bg-green-100 shadow-inner";
                elResultMessage.innerText = "ทำได้ดี! พื้นฐานความรู้ของคุณอยู่ในเกณฑ์ที่ดี";
            } else {
                elResultIcon.innerText = "📚";
                elResultIcon.className = "w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-5xl bg-blue-100 shadow-inner";
                elResultMessage.innerText = "พยายามอีกนิด! ทบทวนเนื้อหาเพิ่มเติมจะช่วยให้เข้าใจได้ดียิ่งขึ้น";
            }
        }

        function resetQuiz() {
            startQuiz();
        }

    </script>
</body>
</html>
